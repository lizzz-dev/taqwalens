<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="lensBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2D5A46"/>
      <stop offset="100%" stop-color="#14261F"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#99771A"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle Shield / Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lensBg)" stroke="url(#goldRim)" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Golden Magnifying Lens Frame -->
  <circle cx="28" cy="28" r="17" stroke="url(#goldRim)" stroke-width="3.5" fill="#183126"/>

  <!-- Glass Optical Reflection -->
  <path d="M 16 28 A 12 12 0 0 1 28 16 A 12 12 0 0 0 16 28 Z" fill="url(#glassSheen)"/>

  <!-- Lens Handle -->
  <line x1="40" y1="40" x2="52" y2="52" stroke="url(#goldRim)" stroke-width="5" stroke-linecap="round"/>
  <line x1="42" y1="42" x2="50" y2="50" stroke="#FCEBA4" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Central Islamic Star / Crescent Motif in Emerald / Gold -->
  <path d="M 28 19 L 29.8 24.5 L 35.5 24.5 L 30.9 27.9 L 32.7 33.4 L 28 30 L 23.3 33.4 L 25.1 27.9 L 20.5 24.5 L 26.2 24.5 Z" fill="#FCEBA4"/>
  <circle cx="28" cy="28" r="3.2" fill="#22C55E"/>
</svg>
